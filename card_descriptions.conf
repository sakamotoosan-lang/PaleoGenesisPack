#Paleozoic Genesis
510000001 0 You can Special Summon this card (from your hand) by sending 1 "Paleozoic" Trap from your Deck to the GY. You can only Special Summon "Paleozoic Genesis" once per turn this way.
510000001 1 If this card is Normal or Special Summoned: You can Set 1 "Paleozoic" Trap directly from your Deck, and if you do, it can be activated this turn. You can only use this effect of "Paleozoic Genesis" once per turn.
510000001 2 If this card is in your GY, and your opponent activates a card or effect: You can Special Summon this card, but banish it when it leaves the field. You can only use this effect of "Paleozoic Genesis" once per Chain.
510000001 3 This face-up card is unaffected by your opponent's monster effects.
